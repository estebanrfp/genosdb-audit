<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="genosdb-audit: Zero Trust evidence review and official CDN provenance checks">
  <defs><style>.f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 2.6px; fill: #9aa3ad; }
.h { font-size: 64px; font-weight: 700; fill: #e6e9ee; letter-spacing: -1.2px; }
.sub { font-size: 22px; fill: #9aa3ad; }
.card-t { font-size: 18px; font-weight: 600; fill: #e6e9ee; }
.card-s { font-size: 14px; fill: #6b7480; }
.cmd { font-size: 14px; fill: #34c77b; }
.tag { font-size: 14px; font-weight: 600; fill: #34c77b; letter-spacing: .6px; }</style></defs>
  <rect width="1200" height="600" fill="#14171c"/>
  <rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#262b33"/>
  <g class="f">
    <text x="80" y="150" class="eyebrow">GENOSDB · AUDIT TOOLKIT · ZERO TRUST EVIDENCE</text>
    <text x="80" y="250" class="h">Check the artifact,</text>
    <text x="80" y="322" class="h">not the promise</text>
    <rect x="80" y="356" width="48" height="3" fill="#34c77b"/>
    <text x="80" y="408" class="sub">Evidence review for Zero Trust receipts and provenance</text>
    <text x="80" y="440" class="sub">of the official CDN release, from the command line.</text>
  </g>
  <g transform="translate(80 478)">
    <rect x="0" y="0" width="236" height="44" rx="8" fill="#1b1f26" stroke="#2f3641"/>
    <text x="18" y="28" class="mono cmd">$ npm run cdn:verify</text>
  </g>
  <g transform="translate(760 140)" class="f">
    <g transform="translate(0 0)"><rect x="0" y="0" width="360" height="82" rx="8" fill="#1b1f26" stroke="#2f3641"/><text x="20" y="34" class="card-t">target.json</text><text x="20" y="60" class="card-s">artifacts hashed, obligations planned</text><circle cx="322" cy="41" r="15" fill="none" stroke="#34c77b" stroke-width="1.6"/><path d="M 315 41 l 5 5 l 10 -11" fill="none" stroke="#34c77b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(0 106)"><rect x="0" y="0" width="360" height="82" rx="8" fill="#1b1f26" stroke="#2f3641"/><text x="20" y="34" class="card-t">receipt.json</text><text x="20" y="60" class="card-s">fingerprints, counts, verdicts, coverage</text><circle cx="322" cy="41" r="15" fill="none" stroke="#34c77b" stroke-width="1.6"/><path d="M 315 41 l 5 5 l 10 -11" fill="none" stroke="#34c77b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(0 212)"><rect x="0" y="0" width="360" height="82" rx="8" fill="#1b1f26" stroke="#2f3641"/><text x="20" y="34" class="card-t">genosdb@latest on the CDN</text><text x="20" y="60" class="card-s">version resolved once, bytes fingerprinted</text><circle cx="322" cy="41" r="15" fill="none" stroke="#34c77b" stroke-width="1.6"/><path d="M 315 41 l 5 5 l 10 -11" fill="none" stroke="#34c77b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <text x="1120" y="556" text-anchor="end" class="f tag">genosdb.com</text>
</svg>
